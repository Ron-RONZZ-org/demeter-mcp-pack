name: Image

on:
  push:
    branches: [ronzz/deploy]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ron-ronzz-org/demeter-mcp-pack

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke (linux/arm64 under QEMU)
        run: |
          set -euo pipefail
          IMG="${IMAGE}:${{ steps.meta.outputs.tag }}"
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/mcp-legifrance "$IMG" --version
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/mcp-judilibre "$IMG" --version
          docker run -d --rm --name legal-smoke --platform linux/arm64 -p 16503:6503 \
            --entrypoint /usr/local/bin/mcp-legifrance "$IMG" \
            --transport http --host 0.0.0.0 --port 6503
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16503/health; then ok=1; break; fi
            sleep 2
          done
          docker stop legal-smoke
          test "$ok" = 1
